[project]
name = "systems-audio-lab"
version = "0.10.0"
description = "A complete systems engineering project, spanning software-driven logistics, custom power regulation, embedded instrumentation, and empirical analysis of non-linear analog circuits."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "pyserial>=3.5",
    "schemdraw>=0.22",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "sounddevice>=0.5.5",
]

[project.urls]
Author = "https://jacksonferguson.me"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["oscilloscope-rp2040"]
include = ["sysaudio*"]

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "mypy>=1.19.1",
    "nbdime>=4.0.3",
    "nbmake>=1.5.5",
    "pandas-stubs>=2.3.3.260113",
    "prek>=0.4.14",
    "pytest>=9.0.2",
    "ruff>=0.14.14",
    "rumdl>=0.2.79",
    "scipy-stubs>=1.17.0.2",
    "types-colorama>=0.4.15.20250801",
    "types-decorator>=5.2.0.20251101",
    "types-defusedxml>=0.7.0.20250822",
    "types-jsonschema>=4.26.0.20260109",
    "types-pexpect>=4.9.0.20260127",
    "types-pygments>=2.19.0.20251121",
    "types-pyserial>=3.5.0.20251001",
    "types-seaborn>=0.13.2.20251221",
]

# ==================================================
# Tool Configuration
# ==================================================

# ---- ruff ---- #

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "A",   # flake8-builtins
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "PT",  # flake8-pytest
    "RET", # flake8-return
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]
ignore = ["D100", "D104", "D107", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"oscilloscope-rp2040/tests/*.py" = ["D"]

# ---- mypy ---- #

[tool.mypy]
mypy_path = "oscilloscope-rp2040"
strict = true
pretty = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
explicit_package_bases = true

exclude = [
    "schematic\\.py$",
    "notebooks/.*",
    "\\.ipynb_checkpoints/.*",
    "firmware/.*",
]

[[tool.mypy.overrides]]
module = ["scipy.*", "sounddevice.*", "serial.*", "seaborn.*", "matplotlib.*"]
ignore_missing_imports = true

# ---- pytest ---- #

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"

testpaths = ["oscilloscope-rp2040/tests"]

# ---- rumdl  ---- #

[tool.rumdl]
disable = [
    "MD013", # line length - creates unnecessary diff churn
    "MD033", # inline HTML – required for readme and parts of documentation
    "MD077", # continuation line indentation – we intentionally use 4 spaces for visual clarity
]

# --- Heading style ---
# Enforce ATX style (# Heading) exclusively; setext (underlined) headings are not allowed
[tool.rumdl.MD003]
style = "atx"

# --- Unordered list style ---
# Use dash (-) for list markers – cleaner than * or +, and reduces git diff noise
[tool.rumdl.MD004]
style = "dash"

# --- Trailing spaces ---
# Allow exactly 2 spaces for hard line breaks (Markdown standard); flag any other stray whitespace
[tool.rumdl.MD009]
br-spaces = 2
strict = false

# --- Duplicate headings ---
# Allow identical subheadings (e.g., "Parameters") as long as they appear under different parent headings
[tool.rumdl.MD024]
siblings-only = true

# --- Ordered list numbering ---
# Use "one" style (1., 1., 1.) so reordering list items doesn't create massive diff churn
[tool.rumdl.MD029]
style = "one"

# --- Per‑directory overrides for docs/ ---
# Relax rules that conflict with Zensical / Python‑Markdown extensions
[tool.rumdl.per-file-ignores]
"docs/**/*.md" = [
    "MD041", # first line need not be a top‑level heading
    "MD046", # code block style – Zensical extensions require mixing fenced and indented blocks for admonitions/tabs
]
