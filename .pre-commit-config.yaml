repos:
  # Generic hooks (configured to IGNORE Python)
  - repo: builtin
    hooks:
      - id: trailing-whitespace
        exclude: \.(py|ipynb)$
      - id: end-of-file-fixer
        exclude: \.(py|ipynb)$
      - id: check-yaml
        exclude: \.ipynb$
      - id: check-added-large-files
        exclude: \.ipynb$
      - id: check-merge-conflict
      - id: check-toml

  # Local Python Toolchain (Managed via uv.lock)
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: true

  # Markdown linting
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: ["--fix"]
